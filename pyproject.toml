[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "architect-net"
version = "1.1.7"
authors = [
  { name="Hiericho", email="hierichovieytes@gmail.com" },
]
description = "Surgical network fingerprinting evasion engine"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Internet :: WWW/HTTP",
    "Development Status :: 4 - Beta",
]
dependencies = [
    "requests>=2.28.0",
    "httpx>=0.24.0",
]

[project.urls]
"Homepage" = "https://github.com/Hiericho/architect"
"Bug Tracker" = "https://github.com/Hiericho/architect/issues"

[tool.setuptools.package-data]
architect = ["bin/*"]

[tool.setuptools.packages.find]
where = ["."]
include = ["architect*"]
